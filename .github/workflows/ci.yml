name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: tests-only
          POSTGRES_USER: wizdesk_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U wizdesk_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests and migration drift
        working-directory: wizdesk_backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://wizdesk_test:tests-only@localhost:5432/postgres' || 'sqlite:///:memory:' }}
        run: |
          python manage.py test --settings=wizdesk_backend.test_settings --noinput
          python manage.py makemigrations --settings=wizdesk_backend.test_settings --check --dry-run
      - name: Collect static and deployment checks
        env:
          SECRET_KEY: ci-only-key-for-static-checks-never-use-in-production-0123456789
          DATABASE_URL: sqlite:///:memory:
          ALLOWED_HOSTS: localhost
          DEBUG: "False"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          WEB_CONCURRENCY: "1"
        run: |
          python wizdesk_backend/manage.py collectstatic --noinput
          python wizdesk_backend/manage.py check --deploy --fail-level WARNING
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/frontend/api.test.cjs
        env:
          TZ: Asia/Kolkata
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
