# render.yaml - Infrastructure as Code for Render deployment
# Deploy with: render blueprint apply (or via dashboard: New > Blueprint)

services:
  - type: web
    name: wizdesk-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "bash release.sh && exec gunicorn --config gunicorn.conf.py wizdesk_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: wizdesk-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CORS_ALLOW_CREDENTIALS
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_CONTENT_TYPE_NOSNIFF
        value: "True"
      - key: X_FRAME_OPTIONS
        value: "DENY"
      - key: SECURE_REFERRER_POLICY
        value: "strict-origin-when-cross-origin"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "1"
      - key: JWT_ROTATE_REFRESH_TOKENS
        value: "True"
      - key: JWT_BLACKLIST_AFTER_ROTATION
        value: "True"
      - key: APP_VERSION
        value: "1.0.0"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "False"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: FRONTEND_URL
        value: ""
      - key: WEB_CONCURRENCY
        value: "1"
    healthCheckPath: /ready/
    autoDeploy: true
    plan: free  # or starter for production

databases:
  - name: wizdesk-db
    databaseName: wizdesk
    user: wizdesk_user
    plan: free  # or starter for production
    region: oregon  # or your preferred region: ohio, frankfurt, singapore
    # For production, consider:
    # - plan: starter (7-day retention, PITR)
    # - enable pg_dump backup schedule

# For custom domain:
# 1. Add domain in Render dashboard > Settings > Custom Domains
# 2. Update ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, CORS_ALLOWED_ORIGINS env vars
# 3. Update this file and re-deploy
