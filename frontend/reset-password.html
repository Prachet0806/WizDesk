{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — WizDesk</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/reset-password.js' %}" defer></script>
</head>
<body class="auth-page">
    <header class="auth-brand">
        <div class="auth-logo" aria-hidden="true">W</div>
        <h1>WizDesk</h1>
        <p>Account recovery</p>
    </header>
    <main class="auth-card">
        <h2 id="reset-title">Reset your password</h2>
        <p class="auth-subtitle" id="reset-description">Enter your account email and we’ll send you a reset link.</p>
        <form id="request-form">
            <div class="form-group">
                <label for="reset-email">Email</label>
                <input id="reset-email" type="email" autocomplete="email" required>
            </div>
            <button class="btn-primary" type="submit">Send reset link</button>
        </form>
        <form id="confirm-form" hidden>
            <div class="form-group">
                <label for="new-password">New password</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn-primary" type="submit">Update password</button>
        </form>
        <p id="reset-message" role="status" aria-live="polite"></p>
        <p><a href="/index.html">Back to sign in</a></p>
    </main>
</body>
</html>
