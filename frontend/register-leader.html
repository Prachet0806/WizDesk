<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Leader - WizDesk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            padding: 20px;
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #dc3545;
            background: #f8f7ff;
        }

        input.success {
            border-color: #28a745;
        }

        input:disabled {
            background: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
        }

        .password-match {
            display: none;
            font-size: 14px;
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .password-match.error {
            display: block;
            color: #dc3545;
            background: #f8d7da;
        }

        .password-match.success {
            display: block;
            color: #155724;
            background: #d4edda;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
        }

        .password-strength.weak {
            display: block;
            color: #721c24;
            background: #f8d7da;
        }

        .password-strength.medium {
            display: block;
            color: #856404;
            background: #fff3cd;
        }

        .password-strength.strong {
            display: block;
            color: #155724;
            background: #d4edda;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }

        .requirement.met {
            color: #28a745;
        }

        .requirement.unmet {
            color: #dc3545;
        }

        .requirement-icon {
            margin-right: 8px;
            font-weight: bold;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-verify {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .btn-verify:hover:not(:disabled) {
            background: linear-gradient(135deg, #218838, #1e7e34);
        }

        /* Verification Section */
        .verification-section {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .verification-status {
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 500;
        }

        .verification-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .verification-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .verification-code-input {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* Success Message */
        .success-message {
            display: none;
            margin-top: 20px;
            padding: 30px;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border-radius: 15px;
            text-align: center;
        }

        .success-message h3 {
            color: #155724;
            margin-bottom: 15px;
        }

        .success-message p {
            color: #155724;
            margin-bottom: 10px;
        }

        .team-code {
            font-size: 1.5rem;
            color: #0c5460;
            font-weight: bold;
            margin: 10px 0;
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 2px dashed #28a745;
        }

        .email-status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            font-weight: 500;
        }

        .email-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .email-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Message Styles */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message.success {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .message.error {
            background: linear-gradient(135deg, #dc3545, #e83e8c);
        }

        .message.warning {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
        }

        /* Loading State */
        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary.loading::after {
            content: ' ⏳';
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-card {
                padding: 30px 25px;
            }
            
            header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WizDesk</h1>
            <p>Register as Team Leader</p>
        </header>

        <div class="form-container">
            <div class="form-card">
                <h2>Create Your Team</h2>
                
                <!-- Registration Form -->
                <form id="leaderRegisterForm">
                    <div class="form-group">
                        <input type="text" id="leaderName" placeholder="Your Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="leaderEmail" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="leaderPassword" placeholder="Password" required minlength="6">
                        <div id="passwordStrength" class="password-strength"></div>
                        <div class="password-requirements">
                            <div class="requirement" id="reqLength">
                                <span class="requirement-icon">○</span>
                                At least 6 characters
                            </div>
                            <div class="requirement" id="reqSpecial">
                                <span class="requirement-icon">○</span>
                                At least 1 special character (!@#$%^&* etc.)
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                        <div id="passwordMatch" class="password-match"></div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="teamName" placeholder="Team Name" required>
                    </div>
                    
                    <button type="button" class="btn-primary" id="createTeamBtn">
                        Create Team
                    </button>
                </form>

                
                <div id="successMessage" class="success-message">
                    <h3>🎉 Registration Successful!</h3>
                    <p>Your team has been created successfully.</p>
                    <p><strong>Team Code: <span id="generatedTeamCode" class="team-code"></span></strong></p>
                    
                    <!-- Email Status Display -->
                    <div id="emailStatus" class="email-status"></div>
                    
                    <p style="font-size: 0.9rem; margin-bottom: 20px;">Please save this team code and share it with your team members.</p>
                    <button onclick="window.location.href='index.html'" class="btn-primary" style="background: linear-gradient(135deg, #28a745, #20c997);">Go to Login</button>
                </div>
                
                <p class="back-link">
                    <a href="index.html">← Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Utility function for showing messages
        const showMessage = (message, type = 'success') => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            setTimeout(() => messageDiv.remove(), 4000);
        };

        // DOM Elements
        const leaderRegisterForm = document.getElementById('leaderRegisterForm');
        const successMessage = document.getElementById('successMessage');
        const createTeamBtn = document.getElementById('createTeamBtn');
        const passwordInput = document.getElementById('leaderPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordMatchDiv = document.getElementById('passwordMatch');
        const passwordStrengthDiv = document.getElementById('passwordStrength');

        // Password requirements elements
        const reqLength = document.getElementById('reqLength');
        const reqSpecial = document.getElementById('reqSpecial');

        let verificationToken = '';

        // Enhanced password strength checker with special character requirement
        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = '';
            let requirements = {
                length: false,
                special: false
            };

            // Length check (minimum 6 characters)
            if (password.length >= 6) {
                strength++;
                requirements.length = true;
            } else {
                feedback = 'Password must be at least 6 characters';
            }

            // Special character check
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) {
                strength++;
                requirements.special = true;
            } else if (!feedback) {
                feedback = 'Password must include at least 1 special character';
            }

            // Update requirement indicators
            updateRequirementIndicators(requirements);

            // Determine strength level
            if (strength < 2) {
                return { level: 'weak', message: feedback || 'Weak password', requirements };
            } else if (strength === 2) {
                return { level: 'strong', message: 'Strong password', requirements };
            } else {
                return { level: 'strong', message: 'Strong password', requirements };
            }
        }

        // Update requirement indicators
        function updateRequirementIndicators(requirements) {
            // Length requirement
            if (requirements.length) {
                reqLength.className = 'requirement met';
                reqLength.innerHTML = '<span class="requirement-icon">✓</span> At least 6 characters';
            } else {
                reqLength.className = 'requirement unmet';
                reqLength.innerHTML = '<span class="requirement-icon">✗</span> At least 6 characters';
            }

            // Special character requirement
            if (requirements.special) {
                reqSpecial.className = 'requirement met';
                reqSpecial.innerHTML = '<span class="requirement-icon">✓</span> At least 1 special character (!@#$%^&* etc.)';
            } else {
                reqSpecial.className = 'requirement unmet';
                reqSpecial.innerHTML = '<span class="requirement-icon">✗</span> At least 1 special character (!@#$%^&* etc.)';
            }
        }

        // Password match checker
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (confirmPassword === '') {
                passwordMatchDiv.className = 'password-match';
                confirmPasswordInput.classList.remove('error', 'success');
                return false;
            }

            if (password === confirmPassword) {
                passwordMatchDiv.textContent = '✓ Passwords match';
                passwordMatchDiv.className = 'password-match success';
                confirmPasswordInput.classList.remove('error');
                confirmPasswordInput.classList.add('success');
                return true;
            } else {
                passwordMatchDiv.textContent = '✗ Passwords do not match';
                passwordMatchDiv.className = 'password-match error';
                confirmPasswordInput.classList.remove('success');
                confirmPasswordInput.classList.add('error');
                return false;
            }
        }

        // Form validation
        function validateForm() {
            const name = document.getElementById('leaderName').value;
            const email = document.getElementById('leaderEmail').value;
            const password = passwordInput.value;
            const teamName = document.getElementById('teamName').value;
            
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            const passwordStrength = checkPasswordStrength(password);
            const isPasswordValid = passwordStrength.requirements.length && passwordStrength.requirements.special;
            const isPasswordMatch = checkPasswordMatch();
            const isFormComplete = name && email && password && teamName;

            createTeamBtn.disabled = !(isFormComplete && isEmailValid && isPasswordValid && isPasswordMatch);
        }

        // Handle direct registration
        async function handleRegistration() {
            const name = document.getElementById('leaderName').value;
            const email = document.getElementById('leaderEmail').value;
            const password = passwordInput.value;
            const teamName = document.getElementById('teamName').value;

            // Disable form fields
            document.querySelectorAll('#leaderRegisterForm input').forEach(input => {
                input.disabled = true;
            });

            createTeamBtn.textContent = 'Creating Team...';
            createTeamBtn.disabled = true;
            createTeamBtn.classList.add('loading');

            try {
                // Step 1: Send "Verification" (Creates the user)
                const sendResponse = await fetch(`${API_BASE}/auth/send-verification/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, teamName })
                });

                const sendResult = await sendResponse.json();

                if (!sendResponse.ok) {
                    throw new Error(sendResult.error || 'Failed to initialize registration');
                }

                const token = sendResult.verificationToken;

                // Step 2: Directly Verify (Completes registration and creates team)
                const verifyResponse = await fetch(`${API_BASE}/auth/verify-email/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const verifyResult = await verifyResponse.json();

                if (verifyResponse.ok) {
                    completeRegistration(verifyResult);
                } else {
                    throw new Error(verifyResult.error || 'Failed to complete registration');
                }
            } catch (error) {
                showMessage(error.message, 'error');
                // Re-enable form fields if failed
                document.querySelectorAll('#leaderRegisterForm input').forEach(input => {
                    input.disabled = false;
                });
                createTeamBtn.textContent = 'Create Team';
                createTeamBtn.disabled = false;
                createTeamBtn.classList.remove('loading');
                validateForm();
            }
        }

        // Complete registration display
        function completeRegistration(result) {
            leaderRegisterForm.style.display = 'none';
            successMessage.style.display = 'block';
            document.getElementById('generatedTeamCode').textContent = result.teamCode;
            
            // Show email status if applicable, otherwise hide
            const emailStatus = document.getElementById('emailStatus');
            if (result.emailSent && result.emailMethod === 'email') {
                emailStatus.innerHTML = `
                    <div class="email-success">
                        ✅ Team code has been sent to your email address: <strong>${result.user.email}</strong>
                    </div>
                `;
            } else {
                emailStatus.innerHTML = `
                    <div class="email-warning">
                        📋 Registration complete! Please save your team code above.
                    </div>
                `;
            }
        }

        // Event Listeners
        createTeamBtn.addEventListener('click', handleRegistration);

        // Password input event listeners
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            if (password.length === 0) {
                passwordStrengthDiv.style.display = 'none';
                passwordInput.classList.remove('error', 'success');
                // Reset requirement indicators
                reqLength.className = 'requirement';
                reqLength.innerHTML = '<span class="requirement-icon">○</span> At least 6 characters';
                reqSpecial.className = 'requirement';
                reqSpecial.innerHTML = '<span class="requirement-icon">○</span> At least 1 special character (!@#$%^&* etc.)';
            } else {
                const strength = checkPasswordStrength(password);
                passwordStrengthDiv.textContent = strength.message;
                passwordStrengthDiv.className = `password-strength ${strength.level}`;
                
                if (strength.level === 'weak') {
                    passwordInput.classList.add('error');
                    passwordInput.classList.remove('success');
                } else {
                    passwordInput.classList.remove('error');
                    passwordInput.classList.add('success');
                }
            }
            
            checkPasswordMatch();
            validateForm();
        });

        confirmPasswordInput.addEventListener('input', function() {
            checkPasswordMatch();
            validateForm();
        });

        // Add input event listeners to all form fields
        document.querySelectorAll('#leaderRegisterForm input').forEach(input => {
            input.addEventListener('input', validateForm);
        });

        // Initialize form validation
        validateForm();
    </script>
</body>
</html>
