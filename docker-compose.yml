version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: wizdesk-db
    environment:
      POSTGRES_DB: wizdesk
      POSTGRES_USER: wizdesk_user
      POSTGRES_PASSWORD: WizDesk@2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizdesk_user -d wizdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wizdesk-backend
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://wizdesk_user:WizDesk@2025@db:5432/wizdesk
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./wizdesk_backend:/app/wizdesk_backend
      - ./frontend:/app/frontend

volumes:
  postgres_data: